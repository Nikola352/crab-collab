[workspace]
resolver = "3"
members = [
    "crates/server",
    "crates/notebook",
    "crates/kernel",
    "crates/execution_queue",
    "crates/ot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
fractional_index = "2.0.2"
